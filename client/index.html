<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Borges e as Baratas</title>
    <style>
      /* specs/017-design-system-grotesco (research §2): as fontes (Luckiest Guy + Baloo 2) vêm do
         @font-face de src/styles/tokens.css, importado em index.ts — não há mais @font-face aqui. */

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: var(--cor-traco, #1b1b1b);
        overflow-x: auto;
      }

      #game {
        width: 100%;
        height: 100%;
        background: var(--cor-traco, #1b1b1b);
      }

      /* specs/015-cursor-pata-animada (research.md §1): condicionada à classe cursor-paw-ready,
         ligada só quando o asset da pata carrega com sucesso (BootScene) — nunca incondicional,
         para que uma falha de load (FR-008) deixe o cursor nativo do sistema visível. Vence o
         style.cursor inline que o Phaser escreve em botões com useHandCursor via !important. */
      #game.cursor-paw-ready canvas {
        cursor: none !important;
      }

      /* specs/017-design-system-grotesco (research §7): proxies DOM dos botões do canvas — dão
         rótulo acessível e foco por teclado sem nunca ficar por cima do canvas (a pata e o clique
         continuam só no canvas). */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui-a11y" aria-label="Controles do jogo"></div>
    <script type="module" src="/index.ts"></script>
  </body>
</html>
